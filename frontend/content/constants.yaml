templates:
  residence_permit_wait_time:
    template: default
    crawler: json
    url: https://allaboutberlin.com/api/forms/residence-permit-feedback.json?page=1&count=1&residence_permit_type={residence_permit_type}
    json_path: stats.start_to_finish.last_12_months.readable_range
  default:
    crawler: html
    delay: 1s
    every: month
    formatting_instructions: |
      Format all numbers using strict Python float/int syntax. No thousands separators (no commas, no spaces). Use a period (.) for decimals.
      If the requested value is not in the supplied text, only return ERROR.
  buzer:
    template: default
    url: https://www.buzer.de/{section}_{law}.htm
    css_selector: .arttext
    subsection: the supplied text
    prompt: |
      You will get the text of § {section} {law}. Considering only {subsection}, return {desired_value}. Ignore all
      information outside of {subsection}. Only return one value. Do not add or concatenate multiple values.
  zusatzbeitrag:
    template: default
    url: https://www.krankenkassen.de/gesetzliche-krankenkassen/krankenkasse-beitrag/zusatzbeitrag/
    css_selector: '#content table'
    prompt: |
      Read this table. Return the latest Zusatzbeitrag for {insurer} as a percentage (in the leftmost column). Return
      only the percentage, without rounding, without percent signs and without thousands separators. For decimal values, use
      a dot as the decimal mark.
