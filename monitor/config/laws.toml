[templates.buzer]
extends = "default"
url = "https://www.buzer.de/{section}_{law}.htm"
every = "30d"
crawler = "html"
selector = ".arttext"
action = "pr"
prompt = """
This is the text of § {section} {law}. Return {desired_value} from that text. If the value is a number, use a dot as the decimal mark. Use no currency symbol and no thousands separator. If the requested value is not in the given text, only return "ERROR".
"""

# ==============================================================================
# ==============================================================================
# ==============================================================================

[monitors.aufenthv-44-max-permanent-residence-fee]
extends = "buzer"
law = "AufenthV"
section = "44"
constant_to_update = "MAX_PERMANENT_RESIDENCE_FEE"
desired_value = "the maximum fee for a permanent residence permit (Niederlassungserlaubnis) in euros"

