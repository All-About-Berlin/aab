[templates.default]
github_repo = "all-About-Berlin/aab"
file = "frontend/constants.json"
branch = "ai"
delay = "1s"
every = "30d"

[monitors.bmas-mindestlohn]
extends = "default"
url = "https://www.bmas.de/DE/Arbeit/Arbeitsrecht/Mindestlohn/mindestlohn.html"
crawler = "playwright"
selector = ".typ-quote-3 p.text"
action = "pr"
constant_to_update = "MINIMUM_WAGE"
prompt = """
Read this page. Return the current minimum wage. Only return the number, without any formatting or currency symbol.
"""

[monitors.bmas-rentenversicherungsbericht]
extends = "default"
url = "https://www.bmas.de/DE/Soziales/Rente-und-Altersvorsorge/rentenversicherungsbericht-art.html"
crawler = "html"
action = "pr"
constant_to_update = "FREELANCE_VISA_MIN_MONTHLY_PENSION"
prompt = """
Read this page. Return the current monthly standard pension (Standardrente / Eckrente) amount in euros. Only return the number with decimals, without currency symbol or formatting.
"""

[monitors.check24-gkv-avg-zusatzbeitrag]
extends = "check24-gkv-zusatzbeitrag"
constant_to_update = "GKV_AVG_ZUSATZBEITRAG"
prompt = """
Read this page. Return the average (durchschnittlicher) Zusatzbeitrag rate as a percentage. Only return the number, without the %% sign.
"""

[monitors.check24-gkv-max-zusatzbeitrag]
extends = "default"
url = "https://www.check24.de/gesetzliche-krankenversicherung/erhoehung-zusatzbeitraege/"
crawler = "html"
action = "pr"
constant_to_update = "GKV_MAX_ZUSATZBEITRAG"
prompt = """
Read this page. Return the highest Zusatzbeitrag rate among all listed health insurance providers, as a percentage. Only return the number, without the %% sign.
"""

[monitors.check24-gkv-min-zusatzbeitrag]
extends = "default"
url = "https://www.check24.de/gesetzliche-krankenversicherung/erhoehung-zusatzbeitraege/"
crawler = "html"
action = "pr"
constant_to_update = "GKV_MIN_ZUSATZBEITRAG"
prompt = """
Read this page. Return the lowest Zusatzbeitrag rate among all listed health insurance providers, as a percentage. Only return the number, without the %% sign.
"""

[monitors.ksk-zahlen]
extends = "default"
url = "https://www.kuenstlersozialkasse.de/service-und-medien/ksk-in-zahlen"
crawler = "html"
action = "pr"
constant_to_update = "KSK_MIN_HEALTH_INSURANCE_INCOME"
prompt = """
Read this page. Return the Mindestbeitragsberechnungsgrundlage (minimum income for health insurance calculation) in euros per year. Only return the number, without currency symbol or formatting.
"""

[monitors.vonengelhardt-helpnow]
extends = "default"
url = "https://www.vonengelhardt.com/en/helpnowen"
crawler = "html"
every = "30d"
action = "pr"
constant_to_update = "LEGAL_HOTLINE_COST_PER_MINUTE"
prompt = """
Read this page. Return the cost per minute for the legal hotline, in euros. Only return the number, without currency symbol or formatting.
"""
