[templates.default]
crawler = "html"
action = "pr"
github_repo = "all-About-Berlin/aab"
file = "frontend/constants.json"
branch = "ai"
delay = "1s"
every = "30d"

# ==============================================================================
# ==============================================================================
# ==============================================================================

[monitors.bmas-mindestlohn]
extends = "default"
url = "https://www.bmas.de/DE/Arbeit/Arbeitsrecht/Mindestlohn/mindestlohn.html"
crawler = "playwright"
selector = ".typ-quote-3 p.text"
constant_to_update = "MINIMUM_WAGE"
prompt = """
Read this page. Return the current minimum wage.
Return only the numeric value, with two decimal places, with a dot as the decimal mark, and without a currency symbol.
If the value can't be found on this page, only return 'ERROR'.
"""

