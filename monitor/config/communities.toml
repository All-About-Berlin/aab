[monitors.reddit-askberliners]
url = "https://old.reddit.com/r/askberliners/new.json"
crawler = "reddit"
every = "1d"
action = "digest"
prompt = """
Read this post. If it's a question about one of these topics, return a one-sentence summary of the post. Otherwise, only return "NOT_RELEVANT".

Here are the topics:

- immigration office (LEA or Ausländerbehörde)
- insurance
"""
